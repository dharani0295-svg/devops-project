name: Docker CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-web-app .

      - name: Deploy to EC2
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -e
          echo "Preparing SSH..."
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          echo "Checking EC2 SSH connectivity..."
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          echo "Connecting to EC2..."
          ssh -i ~/.ssh/ec2_key "$EC2_USERNAME@$EC2_HOST" 'cd ~/devops-project && ./deploy.sh'